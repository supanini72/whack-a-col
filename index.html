<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whack-a-Col'</title>
    
    <link rel="icon" type="image/svg+xml" href="colonie-orange.svg">
    <link rel="apple-touch-icon" href="logo-wack-a-col.svg">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'BPReplay';
            src: url('BPreplay.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; 
            /* --- AJOUT DU FOND SVG --- */
            background-image: url('fond.svg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* ------------------------- */
            font-family: 'Roboto', sans-serif;
            overflow: hidden; touch-action: none;
        }

        /* --- LOGO ABE (Haut Droite) --- */
        .abe-logo {
            position: absolute; top: 25px; right: 30px; width: 150px; z-index: 150;
        }

        /* --- ÉCRAN D'ACCUEIL --- */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(19, 35, 59, 0.9); /* Semi-transparent pour voir le fond derrière */
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200; text-align: center;
        }
        .home-logo { width: 560px; height: auto; margin-bottom: 20px; }
        .home-instruction { color: #ffffff; font-size: 1.5rem; margin: 30px 0; max-width: 600px; opacity: 0.9; }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 0 #b34316; }
            50% { transform: scale(1.05); box-shadow: 0 12px 20px rgba(237, 94, 33, 0.4); }
        }

        #play-button {
            background-color: #ed5e21; color: white; font-family: 'BPReplay', sans-serif;
            font-size: 2.5rem; padding: 20px 60px; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 10px 0 #b34316; 
            animation: pulseBtn 2s infinite ease-in-out; transition: transform 0.1s;
        }
        #play-button:active { transform: translateY(7px); box-shadow: 0 3px 0 #b34316; }

        /* --- INTERFACE DE JEU --- */
        #game-logo-top {
            position: absolute; top: 25px; left: 30px; width: 220px; z-index: 10;
        }
        
        .score-box {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2); padding: 20px 30px; border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px);
            text-align: center; z-index: 10; min-width: 150px; color: white;
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.5);
        }
        #score-container { left: 30px; }
        #best-container { right: 30px; }
        
        .score-label { font-weight: bold; letter-spacing: 2px; font-size: 0.9rem; display: block; margin-bottom: 5px; }
        .score-num { color: #ed5e21; font-size: 6rem; font-weight: 700; display: block; line-height: 1; }
        #best-value { color: #ffbc42; }

        #reset-best {
            position: absolute; bottom: 15px; right: 15px; 
            background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.15);
            border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;
            font-size: 0.7rem; z-index: 20;
        }

        /* Game Over */
        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'BPReplay', sans-serif; font-size: 4rem; color: #ed5e21;
            display: none; text-align: center; background: rgba(19, 35, 59, 0.98);
            padding: 50px; border-radius: 40px; border: 6px solid #ed5e21; z-index: 100;
            box-shadow: 0 0 60px rgba(0,0,0,0.9); cursor: pointer;
        }
        .show-game-over { display: block !important; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        canvas { display: block; }
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translate(0,0); }
            25% { transform: translate(-10px, 0); }
            75% { transform: translate(10px, 0); }
        }
    </style>
</head>
<body>

    <img src="ABE logo.png" class="abe-logo" alt="Alliance Bio Expertise">

    <div id="start-screen">
        <img src="logo-wack-a-col.svg" class="home-logo" alt="Logo Whack-a-Col">
        <p class="home-instruction">Sur ce milieu TBX, comptez les colonies caractéristiques !</p>
        <button id="play-button" onclick="startGame()">Jouer</button>
    </div>

    <img src="logo-wack-a-col.svg" id="game-logo-top">

    <div id="score-container" class="score-box">
        <span class="score-label">SCORE</span>
        <span id="score-value" class="score-num">0</span>
    </div>

    <div id="best-container" class="score-box">
        <span class="score-label">RECORD</span>
        <span id="best-value" class="score-num">0</span>
    </div>

    <button id="reset-best" onclick="resetBestScore()">Reset Data</button>
    
    <div id="game-over" onclick="resetGame()">
        GAME OVER<br>
        <span id="reason" style="font-size:1.6rem; color:#ff9f43; display:block; margin-top:15px; font-family:'Roboto'"></span>
        <span style="font-size:1.4rem; color:white; font-family:'Roboto'; margin-top:25px; display:block; font-weight: bold;">CLIQUER POUR REJOUER</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreValue = document.getElementById('score-value');
        const bestValue = document.getElementById('best-value');
        const gameOverElement = document.getElementById('game-over');
        const reasonElement = document.getElementById('reason');
        const startScreen = document.getElementById('start-screen');

        const imgBoite = new Image(); imgBoite.src = 'Boite.svg';
        const imgBleue = new Image(); imgBleue.src = 'Colonie-bleue.svg';
        const imgBlanche = new Image(); imgBlanche.src = 'Colonie-blanche.svg';
        const imgOndule = new Image(); imgOndule.src = 'colonie-ondule.svg';

        let score = 0;
        let bestScore = localStorage.getItem('whackBestScore') || 0;
        bestValue.innerText = bestScore;

        let gameActive = false, colonies = [], spawnRate = 800, lastSpawn = 0;
        let petriRadius = 0, maxColonySize = 0;

        function resize() {
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight;
            petriRadius = Math.min(canvas.width, canvas.height) * 0.40;
            maxColonySize = Math.min(canvas.width, canvas.height) * 0.35;
        }
        window.addEventListener('resize', resize);
        resize();

        function startGame() { 
            startScreen.style.display = 'none'; 
            gameActive = true; 
            lastSpawn = performance.now();
            requestAnimationFrame(animate);
        }

        class Colonie {
            constructor(isTrap = false) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (petriRadius * 0.70);
                this.x = canvas.width / 2 + Math.cos(angle) * dist;
                this.y = canvas.height / 2 + Math.sin(angle) * dist;
                this.isTrap = isTrap; this.radius = 1; this.growth = 0.87;
                if (!isTrap) {
                    this.img = imgBleue; this.maxS = 999; 
                } else {
                    if (Math.random() < 0.5) { this.img = imgBlanche; this.maxS = 15; }
                    else { this.img = imgOndule; this.maxS = 25; }
                }
            }
            draw() {
                const visR = this.isTrap ? this.radius : Math.min(this.radius, maxColonySize / 2);
                ctx.drawImage(this.img, this.x - visR, this.y - visR, visR * 2, visR * 2);
            }
            update() {
                if (!gameActive) return;
                if (!this.isTrap || this.radius < this.maxS) this.radius += this.growth;
                const d = Math.sqrt(Math.pow(this.x - canvas.width/2, 2) + Math.pow(this.y - canvas.height/2, 2));
                if (!this.isTrap && d + this.radius >= petriRadius) endGame("Une colonie a débordé !");
            }
        }

        function handleInput(e) {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            for (let i = colonies.length - 1; i >= 0; i--) {
                const c = colonies[i];
                const visR = c.isTrap ? c.radius : Math.min(c.radius, maxColonySize / 2);
                if (Math.sqrt(Math.pow(cx - c.x, 2) + Math.pow(cy - c.y, 2)) <= visR + 25) {
                    if (c.isTrap) return endGame("Ici on ne compte que les colonies caractéristiques !");
                    colonies.splice(i, 1);
                    score++;
                    scoreValue.innerText = score;
                    if (score > bestScore) {
                        bestScore = score;
                        bestValue.innerText = bestScore;
                        localStorage.setItem('whackBestScore', bestScore);
                    }
                    spawnRate = Math.max(180, spawnRate * 0.95);
                    return;
                }
            }
        }

        function endGame(r) { 
            gameActive = false; 
            reasonElement.innerText = r; 
            canvas.classList.add('shake'); 
            setTimeout(() => { gameOverElement.classList.add('show-game-over'); }, 200); 
        }

        function resetGame() { 
            score = 0; scoreValue.innerText = "0"; colonies = []; 
            gameActive = true; spawnRate = 800; 
            canvas.classList.remove('shake'); 
            gameOverElement.classList.remove('show-game-over'); 
            lastSpawn = performance.now(); 
            requestAnimationFrame(animate); 
        }

        function resetBestScore() {
            const mdp = prompt("Mot de passe :");
            if (mdp === "jvlivs") {
                bestScore = 0;
                localStorage.setItem('whackBestScore', 0);
                bestValue.innerText = 0;
                alert("Record réinitialisé.");
            } else if (mdp !== null) {
                alert("Accès refusé.");
            }
        }

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e); }, { passive: false });

        function animate(t) {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(imgBoite, canvas.width/2 - petriRadius*1.05, canvas.height/2 - petriRadius*1.05, petriRadius*2.1, petriRadius*2.1);
            if (t - lastSpawn > spawnRate) {
                colonies.push(new Colonie(Math.random() < 0.35));
                lastSpawn = t;
            }
            colonies.forEach(c => { c.update(); c.draw(); });
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
