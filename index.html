<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Whack-a-Col">
    <link rel="apple-touch-icon" href="logo-wack-a-col.svg">
    
    <title>Whack-a-Col</title>
    
    <link rel="icon" type="image/svg+xml" href="colonie-orange.svg">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'BPReplay';
            src: url('BPreplay.otf') format('opentype');
            font-weight: normal; font-style: normal;
        }

        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; background-image: url('fond.svg'); background-size: cover;
            background-position: center; font-family: 'Roboto', sans-serif;
            overflow: hidden; touch-action: none; background-color: #13233b;
        }

        /* --- LOGOS --- */
        .abe-logo { position: absolute; top: 20px; right: 25px; width: 140px; z-index: 500; }
        #game-logo-top { position: absolute; top: 20px; left: 25px; width: 200px; z-index: 10; }

        /* --- ÉCRANS --- */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(19, 35, 59, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; text-align: center;
        }

        .home-logo { width: 80%; max-width: 500px; height: auto; margin-bottom: 20px; }
        .home-instruction { color: #ffffff; font-size: 1.3rem; margin: 15px 0; max-width: 800px; line-height: 1.4; padding: 0 20px; }

        .btn-main {
            background-color: #ed5e21; color: white; font-family: 'BPReplay', sans-serif;
            font-size: 2rem; padding: 15px 45px; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 8px 0 #b34316; transition: 0.1s;
        }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 4px 0 #b34316; }

        /* --- FORMULAIRE --- */
        .form-container { background: rgba(255,255,255,0.08); padding: 30px; border-radius: 25px; border: 2px solid #ed5e21; width: 90%; max-width: 420px; }
        .form-container input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 2px solid transparent; font-size: 1.1rem; box-sizing: border-box; }
        .form-container input:focus { border-color: #ed5e21; outline: none; }
        
        /* Bouton Spécifique Formulaire en Roboto */
        .btn-ready {
            background-color: #ed5e21; color: white; font-family: 'Roboto', sans-serif;
            font-weight: bold; font-size: 1.4rem; padding: 15px; border: none; border-radius: 10px;
            cursor: pointer; width: 100%; margin-top: 15px; box-shadow: 0 4px 0 #b34316;
        }

        /* --- INTERFACE --- */
        .score-box {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15); padding: 15px; border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px);
            text-align: center; z-index: 10; min-width: 150px; color: white;
        }
        #score-container { left: 20px; }
        #best-container { right: 20px; }
        
        .score-num { color: #ed5e21; font-size: 4rem; font-weight: 700; line-height: 1; }
        #leaderboard { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.2); text-align: left; font-size: 0.85rem; }
        .leader-entry { display: flex; justify-content: space-between; color: #ffbc42; margin-bottom: 3px; }

        /* --- GAME OVER --- */
        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'BPReplay', sans-serif; display: none; text-align: center;
            background: rgba(19, 35, 59, 0.98); padding: 40px; border-radius: 35px;
            border: 5px solid #ed5e21; z-index: 2000; width: 80%; max-width: 450px; color: white;
        }

        /* Bouton Admin Discret */
        #admin-trigger {
            position: absolute; bottom: 10px; right: 15px; 
            background: none; border: none; color: rgba(255,255,255,0.2);
            font-size: 0.7rem; cursor: pointer; z-index: 3000;
        }

        canvas { display: block; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-8px, 0); } 75% { transform: translate(8px, 0); } }
    </style>
</head>
<body>

    <img src="ABE logo.png" class="abe-logo">

    <div id="start-screen" class="overlay-screen">
        <img src="logo-wack-a-col.svg" class="home-logo">
        <div class="home-instruction">
            Sur ce milieu TBX, on ne compte que les colonies caractéristiques !<br>
            <strong>Faites le meilleur score et tentez de remporter une surprise ! (3 essais)</strong>
        </div>
        <button class="btn-main" onclick="showRegistration()">Jouer</button>
    </div>

    <div id="registration-screen" class="overlay-screen" style="display:none;">
        <div class="form-container">
            <img src="logo-wack-a-col.svg" style="width:180px; margin-bottom:20px;">
            <form id="regForm" onsubmit="event.preventDefault(); validateRegistration();">
                <input type="text" id="p_pseudo" placeholder="Pseudo" required>
                <input type="text" id="p_prenom" placeholder="Prénom" required>
                <input type="text" id="p_nom" placeholder="Nom" required>
                <input type="email" id="p_email" placeholder="Email" required>
                <button type="submit" class="btn-ready">Je suis prêt.e à compter !</button>
            </form>
        </div>
    </div>

    <div id="game-over">
        <h1 id="go-title" style="color:#ed5e21; margin:0; font-size: 2.5rem;">GAME OVER</h1>
        <p id="reason" style="font-size:1.2rem; color:#ff9f43; margin: 15px 0;"></p>
        <p id="session-score-msg" style="font-size:1.3rem; font-family:'Roboto'"></p>
        <button id="next-btn" class="btn-main" style="font-size: 1.3rem; padding: 12px 30px;" onclick="nextSession()">Suivant</button>
    </div>

    <img src="logo-wack-a-col.svg" id="game-logo-top">
    
    <div id="score-container" class="score-box">
        <span style="font-size:0.7rem; font-weight:bold;">SCORE</span>
        <span id="score-value" class="score-num">0</span>
        <span id="session-label" style="display:block; margin-top:5px; opacity:0.8; font-size:0.8rem;">Session 1 / 3</span>
    </div>

    <div id="best-container" class="score-box">
        <span style="font-size:0.7rem; font-weight:bold;">RECORD</span>
        <span id="best-value" class="score-num" style="font-size: 3rem; color:#ffbc42">0</span>
        <div id="leaderboard">
            <div style="font-weight:bold; margin-bottom:5px; font-size:0.65rem; opacity:0.6;">TOP 3</div>
            <div id="top-entries"></div>
        </div>
    </div>

    <button id="admin-trigger" onclick="openAdminMenu()">admin</button>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const imgBoite = new Image(); imgBoite.src = 'Boite.svg';
        const imgBleue = new Image(); imgBleue.src = 'Colonie-bleue.svg';
        const imgBlanche = new Image(); imgBlanche.src = 'Colonie-blanche.svg';
        const imgOndule = new Image(); imgOndule.src = 'colonie-ondule.svg';

        let currentPlayer = null, currentSession = 1, sessionScores = [];
        let score = 0, gameActive = false, colonies = [], spawnRate = 800, lastSpawn = 0;
        let petriRadius = 0, maxColonySize = 0;

        updateLeaderboardDisplay();

        function showRegistration() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('registration-screen').style.display = 'flex';
        }

        function validateRegistration() {
            const emailField = document.getElementById('p_email');
            if(!emailField.checkValidity()) { alert("Email invalide"); return; }
            currentPlayer = {
                pseudo: document.getElementById('p_pseudo').value,
                prenom: document.getElementById('p_prenom').value,
                nom: document.getElementById('p_nom').value,
                email: emailField.value,
                heure: new Date().toLocaleTimeString(),
                date: new Date().toLocaleDateString()
            };
            currentSession = 1; sessionScores = [];
            document.getElementById('registration-screen').style.display = 'none';
            startNewGame();
        }

        function startNewGame() {
            resize(); 
            score = 0; colonies = []; spawnRate = 800; gameActive = true;
            document.getElementById('score-value').innerText = "0";
            document.getElementById('session-label').innerText = `Session ${currentSession} / 3`;
            document.getElementById('game-over').style.display = 'none';
            canvas.classList.remove('shake');
            lastSpawn = performance.now();
            requestAnimationFrame(animate);
        }

        function endGame(r) {
            gameActive = false;
            sessionScores.push(score);
            canvas.classList.add('shake');
            document.getElementById('reason').innerText = r;
            const btn = document.getElementById('next-btn');
            
            if(currentSession < 3) {
                document.getElementById('session-score-msg').innerText = `Score : ${score}`;
                btn.innerText = "Suivant";
            } else {
                const total = sessionScores.reduce((a,b) => a+b, 0);
                const max = Math.max(...sessionScores);
                document.getElementById('session-score-msg').innerHTML = `Score : ${score}<br><br><span style="color:#ffbc42">Bien ${currentPlayer.pseudo} : vous avez compté ${total} colonies caractéristiques !</span>`;
                btn.innerText = "Terminer";
                savePlayerData(total, max);
            }
            setTimeout(() => { document.getElementById('game-over').style.display = 'block'; }, 300);
        }

        function nextSession() {
            if(currentSession < 3) { currentSession++; startNewGame(); } 
            else { location.reload(); }
        }

        function savePlayerData(total, max) {
            let players = JSON.parse(localStorage.getItem('whack_players') || '[]');
            currentPlayer.s1 = sessionScores[0]; currentPlayer.s2 = sessionScores[1]; currentPlayer.s3 = sessionScores[2];
            currentPlayer.total = total; currentPlayer.best = max;
            players.push(currentPlayer);
            localStorage.setItem('whack_players', JSON.stringify(players));
            updateLeaderboardDisplay();
        }

        function updateLeaderboardDisplay() {
            let players = JSON.parse(localStorage.getItem('whack_players') || '[]');
            players.sort((a,b) => b.best - a.best);
            const top = players.slice(0, 3);
            const container = document.getElementById('top-entries');
            container.innerHTML = '';
            top.forEach((p, i) => {
                container.innerHTML += `<div class="leader-entry"><span>${i+1}. ${p.pseudo}</span><span>${p.best}</span></div>`;
            });
            document.getElementById('best-value').innerText = top.length > 0 ? top[0].best : 0;
        }

        function openAdminMenu() {
            const mdp = prompt("Admin :");
            if(mdp === "jvlivs") {
                const action = prompt("CSV ou RESET ?");
                if(action && action.toUpperCase() === 'CSV') exportCSV();
                else if(action && action.toUpperCase() === 'RESET') {
                    if(confirm("Effacer tout ?")) { localStorage.removeItem('whack_players'); updateLeaderboardDisplay(); }
                }
            }
        }

        function exportCSV() {
            let players = JSON.parse(localStorage.getItem('whack_players') || '[]');
            if(players.length === 0) return;
            let csv = "Date;Heure;Pseudo;Prenom;Nom;Email;S1;S2;S3;Total;Best\n";
            players.forEach(p => csv += `${p.date};${p.heure};${p.pseudo};${p.prenom};${p.nom};${p.email};${p.s1};${p.s2};${p.s3};${p.total};${p.best}\n`);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Data_Salon.csv`;
            link.click();
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const minSide = Math.min(canvas.width, canvas.height);
            petriRadius = (minSide * 0.85) / 2;
            maxColonySize = petriRadius * 0.4; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Colonie {
            constructor(isTrap = false) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (petriRadius * 0.75);
                this.x = canvas.width / 2 + Math.cos(angle) * dist;
                this.y = canvas.height / 2 + Math.sin(angle) * dist;
                this.isTrap = isTrap; this.radius = 1; this.growth = 0.9;
                if (!isTrap) { this.img = imgBleue; this.maxS = 999; } 
                else { this.img = (Math.random() < 0.5) ? imgBlanche : imgOndule; this.maxS = (this.img === imgBlanche) ? 18 : 28; }
            }
            draw() {
                const visR = this.isTrap ? this.radius : Math.min(this.radius, maxColonySize);
                ctx.drawImage(this.img, this.x - visR, this.y - visR, visR * 2, visR * 2);
            }
            update() {
                if (!this.isTrap || this.radius < this.maxS) this.radius += this.growth;
                const d = Math.sqrt(Math.pow(this.x - canvas.width/2, 2) + Math.pow(this.y - canvas.height/2, 2));
                if (!this.isTrap && d + this.radius >= petriRadius) endGame("Une colonie a débordé !");
            }
        }

        function handleInput(e) {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            for (let i = colonies.length - 1; i >= 0; i--) {
                const c = colonies[i];
                const visR = c.isTrap ? c.radius : Math.min(c.radius, maxColonySize);
                if (Math.sqrt(Math.pow(cx - c.x, 2) + Math.pow(cy - c.y, 2)) <= visR + 30) {
                    if (c.isTrap) return endGame("Ici on ne compte que les colonies caractéristiques !");
                    colonies.splice(i, 1); score++;
                    document.getElementById('score-value').innerText = score;
                    spawnRate = Math.max(160, spawnRate * 0.96); return;
                }
            }
        }

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e); }, { passive: false });

        function animate(t) {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(imgBoite, canvas.width/2 - petriRadius*1.05, canvas.height/2 - petriRadius*1.05, petriRadius*2.1, petriRadius*2.1);
            if (t - lastSpawn > spawnRate) { colonies.push(new Colonie(Math.random() < 0.35)); lastSpawn = t; }
            colonies.forEach(c => { c.update(); c.draw(); });
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
